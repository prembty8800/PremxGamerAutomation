<!DOCTYPE html>
<html>
<head><title>Token Test</title></head>
<body>
    <input type="password" id="t" placeholder="Paste Token">
    <button onclick="testToken()">Test Token</button>
    <script>
        async function testToken() {
            const token = document.getElementById('t').value.trim();
            const res = await fetch('https://api.github.com/user', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (res.ok) {
                const data = await res.json();
                alert('Token Valid! Logged in as: ' + data.login);
            } else {
                alert('Token Invalid / Bad Credentials!');
            }
        }
    </script>
</body>
</html>
